name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: windows-x86_64, os: windows-2022 }
          - { name: macos-arm64, os: macos-15 }
          # GitHub's Intel macOS label; if it is retired, move this slice to a self-hosted Intel Mac
          # (docs/plan/03-macos-platform.md §5.2). The arm64 job also cross-builds x86_64 below.
          - { name: macos-x86_64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Environment
        run: cargo xtask doctor

      - name: fmt, clippy, tests, repo hygiene
        run: cargo xtask ci

      - name: Cross-build x86_64 slice (universal binary readiness)
        if: matrix.name == 'macos-arm64'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --workspace --locked --target x86_64-apple-darwin

  qml-tokens:
    name: qml-tokens (Qt 6.4, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt 6 QML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript libqt6quicktest6

      - name: Generated tokens are current
        run: python3 scripts/gen_tokens.py --check

      - name: qmllint and QML runtime test of the Tokens singleton
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          /usr/lib/qt6/bin/qmllint -I ui/tokens/generated/qml ui/tokens/generated/qml/DrorControl/Tokens/Tokens.qml
          /usr/lib/qt6/bin/qmltestrunner -import ui/tokens/generated/qml -input ui/tokens/tests
