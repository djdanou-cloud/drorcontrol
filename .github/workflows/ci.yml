name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: windows-x86_64, os: windows-2022 }
          - { name: macos-arm64, os: macos-15 }
          # GitHub's Intel macOS label; if it is retired, move this slice to a self-hosted Intel Mac
          # (docs/plan/03-macos-platform.md §5.2). The arm64 job also cross-builds x86_64 below.
          - { name: macos-x86_64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Environment
        run: cargo xtask doctor

      - name: fmt, clippy, tests, repo hygiene
        run: cargo xtask ci

      - name: Cross-build x86_64 slice (universal binary readiness)
        if: matrix.name == 'macos-arm64'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --workspace --locked --target x86_64-apple-darwin

  qml-tokens:
    name: qml-tokens (Qt 6.4, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt 6 QML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript libqt6quicktest6

      - name: Generated tokens are current
        run: python3 scripts/gen_tokens.py --check

      - name: qmllint and QML runtime test of the Tokens singleton
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          /usr/lib/qt6/bin/qmllint -I ui/tokens/generated/qml ui/tokens/generated/qml/DrorControl/Tokens/Tokens.qml
          /usr/lib/qt6/bin/qmltestrunner -import ui/tokens/generated/qml -input ui/tokens/tests

  docs:
    name: docs (mkdocs --strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install pinned docs toolchain
        run: pip install -r docs/requirements.txt

      - name: Generated indexes are current (ADRs, tokens)
        run: |
          python3 scripts/gen_adr_index.py --check
          python3 scripts/gen_tokens.py --check

      - name: Build site (any warning fails)
        run: mkdocs build --strict

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 14

  sitl:
    name: sitl scenarios (ArduCopter 4.7.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SITL_TAG: Copter-4.7.1
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only the binary and its default parameters are cached, keyed on the build script and
      # the pinned tag; a cache miss builds ArduPilot from source (~10 min).
      - name: Restore SITL build
        id: sitl-cache
        uses: actions/cache@v4
        with:
          path: .sitl-dist
          key: sitl-${{ env.SITL_TAG }}-${{ runner.os }}-${{ hashFiles('scripts/build_sitl.sh') }}

      - name: Build SITL from source (cache miss)
        if: steps.sitl-cache.outputs.cache-hit != 'true'
        run: |
          scripts/build_sitl.sh .sitl "$SITL_TAG" copter
          mkdir -p .sitl-dist
          cp ".sitl/ardupilot-$SITL_TAG/build/sitl/bin/arducopter" .sitl-dist/
          cp ".sitl/ardupilot-$SITL_TAG/Tools/autotest/default_params/copter.parm" .sitl-dist/

      - name: Scenarios (connect, parameters, 30 % loss, fade, reconnect)
        env:
          DC_SITL_REQUIRED: "1"
          DC_SITL_BIN: ${{ github.workspace }}/.sitl-dist/arducopter
          DC_SITL_DEFAULTS: ${{ github.workspace }}/.sitl-dist/copter.parm
        run: cargo test -p sitl-harness --locked -- --nocapture

  macos-package:
    name: macOS package (universal, ad-hoc signed)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build, sign, verify, package (ADR-0010)
        run: packaging/macos/package.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: drorcontrol-macos
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS
          retention-days: 30

  macos-package-launch-intel:
    name: macOS package launches on Intel
    needs: macos-package
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: drorcontrol-macos
          path: dist

      - name: Checksums, signature, launch (zip and dmg)
        working-directory: dist
        run: |
          shasum -a 256 -c SHA256SUMS
          ditto -x -k DrorControl-*.zip unzipped
          APP=unzipped/DrorControl.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          test "$(uname -m)" = x86_64
          "$APP/Contents/MacOS/dc-cli" --version
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" DrorControl-*.dmg
          "$MNT/DrorControl.app/Contents/MacOS/dc-cli" --version
          test -f "$MNT/FIRST-LAUNCH.txt"
          hdiutil detach "$MNT"

  video-spike-macos:
    # Spike S0-5 (T0-09): proves the harness builds on macOS and records a first VideoToolbox
    # reading on a CI runner (a VM: numbers are indicative; the pass/fail run is on a real Mac,
    # see the Mac test runbook). Fails only if the harness cannot build or run.
    name: video spike S0-5 (macOS, informational)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/spikes/s0-5-video

      - name: Install GStreamer
        run: brew install gstreamer pkgconf

      - name: Build harness
        run: cargo build --release --manifest-path ui/spikes/s0-5-video/Cargo.toml

      - name: Encode a 1080p30 sample, measure decode
        run: |
          B=ui/spikes/s0-5-video/target/release/spike-s0-5-video
          $B make-sample sample.mkv 20
          $B run sample.mkv --seconds 12 --warmup 3 --report s05-macos-ci.json
          for d in vtdec_hw vtdec avdec_h264; do
            $B run sample.mkv --seconds 8 --warmup 2 --decoder $d --report s05-macos-ci-$d.json || echo "$d: not usable here"
          done
          # The GL-memory path (needs a Cocoa run loop; not what the Metal GCS uses), for comparison.
          $B run sample.mkv --seconds 8 --warmup 2 --decoder vtdec_hw --output any --report s05-macos-ci-vtdec_hw-gl.json || true
          { echo '### Spike S0-5 on the CI runner (indicative)'; echo '```'; cat s05-macos-ci*.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: spike-s0-5-macos-ci
          path: s05-macos-ci*.json
          retention-days: 30
