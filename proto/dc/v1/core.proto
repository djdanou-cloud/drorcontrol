// DrorControl core API, version 1.
//
// Served by `dc-cli daemon` (and later the desktop app's embedded core) over gRPC.
// Read-only apart from SetParams (ADR-0012 item 1), which the daemon serves only when
// started with a baseline directory. Vehicle commands arrive with the command-safety layer
// (CommandPolicy, plan 08 §4) so remote clients cannot bypass interlocks.
//
// Compatibility: fields are only ever added (buf breaking-change check in CI, plan 06).
syntax = "proto3";

package dc.v1;

service Core {
  // Core identity and versions.
  rpc GetInfo(GetInfoRequest) returns (Info);
  // Open an additional link (same syntax as dc-cli --connect).
  rpc OpenLink(OpenLinkRequest) returns (OpenLinkReply);
  // Vehicles heard so far with their latest telemetry.
  rpc ListVehicles(ListVehiclesRequest) returns (VehicleList);
  // Download every parameter from a component (may take tens of seconds on slow links).
  rpc GetParams(GetParamsRequest) returns (ParamList);
  // Telemetry snapshots for one vehicle at a fixed rate.
  rpc StreamTelemetry(StreamTelemetryRequest) returns (stream Vehicle);
  // STATUSTEXT messages and link/vehicle events as they happen.
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);
  // Download the mission, the geofence or the rally points.
  rpc DownloadItems(DownloadItemsRequest) returns (ItemList);
  // The last 500 STATUSTEXT lines from a vehicle, oldest first (the "Messages" view).
  rpc GetMessages(GetMessagesRequest) returns (MessageList);
  // Photos the vehicle reported taking (CAMERA_FEEDBACK), in order (survey geotags).
  rpc GetGeotags(GetGeotagsRequest) returns (GeotagList);
  // Dataflash logs on the vehicle (read-only; the vehicle must be disarmed).
  rpc ListLogs(ListLogsRequest) returns (LogList);
  // Download one log: progress updates, then the data in chunks (the last has done = true).
  // Logs are never erased by this API.
  rpc DownloadLog(DownloadLogRequest) returns (stream LogDownloadUpdate);
  // The router: open links, learned routes and counters (diagnostics).
  rpc GetLinkStats(GetLinkStatsRequest) returns (LinkStats);
  // Change parameters (ADR-0012 item 1). The client shows the changes and asks the operator
  // once before calling. The daemon saves a baseline of every parameter in its own baseline
  // directory first, then writes each value and reads it back. If the vehicle is armed and
  // acknowledge_armed_warning is false, nothing is sent and the reply carries armed_warning:
  // show it as a warning pop-up and, if the operator acknowledges it, call again with
  // acknowledge_armed_warning = true. FAILED_PRECONDITION when the daemon has no baseline
  // directory (writes off).
  rpc SetParams(SetParamsRequest) returns (SetParamsReply);
  // Upload a mission, geofence or rally list, then read it back (ADR-0012 amendment). The
  // client shows the list and asks the operator once before calling. Behind the daemon's
  // vehicle-change settings (its settings file; off by default, not changeable over this
  // API): a fence or rally upload needs fence-rally-upload, a mission to a vehicle not known
  // to be disarmed needs armed-mission-upload; FAILED_PRECONDITION names the setting and
  // nothing is sent. To an armed vehicle, as SetParams: armed_warning back until
  // acknowledge_armed_warning is set. An empty list clears it on the vehicle.
  rpc UploadItems(UploadItemsRequest) returns (UploadItemsReply);
  // Erase every dataflash log on the vehicle (LOG_ERASE), then list them to check. Needs the
  // log-erase setting and a disarmed vehicle; cannot be undone. The client asks first.
  rpc EraseLogs(EraseLogsRequest) returns (EraseLogsReply);
  // The daemon's vehicle-change settings, with each one's warning (read-only).
  rpc GetVehicleChangeSettings(GetVehicleChangeSettingsRequest) returns (VehicleChangeSettingList);
}

message UploadItemsRequest {
  uint32 sysid = 1;          // 0 = first vehicle heard
  uint32 compid = 2;         // 0 = autopilot (1)
  ItemKind kind = 3;
  repeated Item items = 4;   // a mission's item 0 is home
  bool acknowledge_armed_warning = 5;
}

message UploadItemsReply {
  // Set when nothing was sent because the vehicle is armed: the text to show.
  string armed_warning = 1;
  bool verified = 2;         // the vehicle holds exactly these items (read back)
  string upload = 3;         // the transfer's own outcome
  string readback = 4;       // the read-back's outcome
  repeated string mismatches = 5;  // "item N field: sent X vehicle Y"
}

message EraseLogsRequest {
  uint32 sysid = 1;
  uint32 compid = 2;
}

message EraseLogsReply {
  bool verified = 1;         // none of the earlier logs is listed any more
  uint32 erased = 2;         // logs listed before the erase
  uint32 new_logs = 3;       // logs the vehicle started after it
  uint32 still_listed = 4;   // earlier logs still listed (not verified)
}

message GetVehicleChangeSettingsRequest {}

message VehicleChangeSetting {
  string key = 1;            // e.g. fence-rally-upload
  string title = 2;
  string warning = 3;        // the danger, to show next to it
  bool on = 4;
}

message VehicleChangeSettingList {
  repeated VehicleChangeSetting settings = 1;
}

message GetInfoRequest {}

message Info {
  string version = 1;        // crate version of dc-core
  uint32 sysid = 2;          // our MAVLink system id
  uint32 compid = 3;         // our MAVLink component id
  string dialect = 4;        // root MAVLink XML, e.g. "ardupilotmega.xml"
}

message OpenLinkRequest {
  // e.g. "tcp:127.0.0.1:5760", "udp:0.0.0.0:14550", "serial:/dev/ttyACM0:115200"; append
  // "?profile=high" or "?profile=constrained-elrs" for a slow link (default full).
  string spec = 1;
}

message OpenLinkReply {
  uint32 link_id = 1;
}

message ListVehiclesRequest {}

message VehicleList {
  repeated Vehicle vehicles = 1;
}

// Latest telemetry for one system. Each group is absent until first received; `age_ms`
// tells how old it is (UIs must flag stale data, plan 04 §4).
message Vehicle {
  uint32 sysid = 1;
  optional HeartbeatState heartbeat = 2;
  optional AttitudeState attitude = 3;
  optional PositionState position = 4;
  optional PowerState power = 5;
  optional GpsState gps = 6;
  optional MissionProgress mission = 7;
  optional LandedState landed = 8;
  // Navigation health (hazard H16), from EKF_STATUS_REPORT with ArduPilot's failsafe rule.
  // Set by ListVehicles and StreamTelemetry.
  optional NavHealth nav = 9;
  // Heartbeat-based link state, as in VehicleLinkEvent.
  VehicleLinkEvent.State link = 10;
  optional HomeState home = 11;
  // ADS-B traffic reported through this vehicle (forgotten after 60 s without a report).
  repeated TrafficState traffic = 12;
  // Batteries from BATTERY_STATUS, by id (PowerState is the SYS_STATUS summary).
  repeated BatteryState batteries = 13;
  optional VibrationState vibration = 14;
  optional WindState wind = 15;
  optional RcState rc = 16;
  repeated ServoState servos = 17;
  optional RadioState radio = 18;
  repeated RangefinderState rangefinders = 19;
  optional TerrainState terrain = 20;
  optional AutopilotVersionState autopilot_version = 21;
  // Frames received and lost per component of this system (MAVLink sequence numbers).
  repeated StreamQualityState streams = 22;
  // Link quality (plan 08 §4.3 DEGRADED): autopilot packet loss over 10 s and RC link
  // quality when reported. Informs only; command delivery follows `link`.
  optional LinkQualityState link_quality = 23;
}

message LinkQualityState {
  enum State {
    UNKNOWN = 0;
    GOOD = 1;
    DEGRADED = 2;
  }
  State state = 1;
  optional float loss_pct = 2;
  optional float rc_lq_pct = 3;
  repeated string reasons = 4;
}

message StreamQualityState {
  uint32 compid = 1;
  uint64 received = 2;
  uint64 lost = 3;
  optional float recent_loss_pct = 4;  // over the last 10 s
}

// From AUTOPILOT_VERSION (requested once on connect).
message AutopilotVersionState {
  string version = 1;        // e.g. "4.7.1-official"
  string git_hash = 2;       // first 8 characters
  uint32 board_id = 3;       // APJ_BOARD_ID
  uint32 vendor_id = 4;
  uint32 product_id = 5;
  uint64 uid = 6;
  uint64 capabilities = 7;   // MAV_PROTOCOL_CAPABILITY bits
  // Whether DrorControl's automated tests cover this firmware and major.minor version
  // (ArduCopter 4.6 and 4.7); unset until the version banner confirms the firmware.
  optional bool tested = 8;
}

// From TERRAIN_REPORT: terrain under the vehicle from the autopilot's terrain database.
message TerrainState {
  uint32 age_ms = 1;
  float terrain_msl_m = 2;
  float height_above_m = 3;
  bool extrapolated = 4;  // no data here: heights extrapolated from the last known terrain
  uint32 pending = 5;     // 4x4 blocks still to load
  uint32 loaded = 6;
  bool no_position = 7;   // report for 0,0 before the vehicle has a position: ignore values
}

// From DISTANCE_SENSOR, by sensor id.
message RangefinderState {
  uint32 age_ms = 1;
  uint32 id = 2;
  uint32 orientation = 3;  // MAV_SENSOR_ORIENTATION, 25 = facing down
  uint32 kind = 4;         // MAV_DISTANCE_SENSOR
  float distance_m = 5;
  float min_m = 6;
  float max_m = 7;
  bool in_range = 8;       // outside min..max the reading is not a measurement
  optional uint32 signal_quality = 9;
}

// From RADIO_STATUS (a telemetry radio, under the system id it reports with). Signal
// values in the radio's own scale (SiK: about 2 x dB); absent when unknown.
message RadioState {
  uint32 age_ms = 1;
  uint32 compid = 2;
  optional uint32 rssi = 3;
  optional uint32 remote_rssi = 4;
  optional uint32 noise = 5;
  optional uint32 remote_noise = 6;
  uint32 txbuf_pct = 7;
  uint32 rx_errors = 8;
  uint32 corrected = 9;
}

// From RC_CHANNELS: what the RC receiver delivers.
message RcState {
  uint32 age_ms = 1;
  repeated uint32 channels_us = 2;  // the channels received (at most 18)
  uint32 count = 3;                 // channels the receiver reports
  optional uint32 rssi = 4;         // 0-254, receiver's own scale
  // What rssi measures (RSSI_TYPE, RC_OPTIONS bit 11, or the autopilot's CRSF message) and
  // rssi as a percentage of it.
  SignalKind kind = 5;
  optional float signal_pct = 6;
  // From the autopilot's CRSF/ELRS messages: "ELRS", "CRSFv3" or "CRSFv2", and its rates.
  string protocol = 7;
  optional uint32 link_rate_hz = 8;
  optional uint32 telemetry_rate_hz = 9;

  enum SignalKind {
    SIGNAL_KIND_UNKNOWN = 0;
    SIGNAL_KIND_RSSI = 1;
    SIGNAL_KIND_LINK_QUALITY = 2;
  }
}

// From SERVO_OUTPUT_RAW: outputs 1-16 of one port, us (0 = not driven).
message ServoState {
  uint32 age_ms = 1;
  uint32 port = 2;  // 0 = MAIN
  repeated uint32 outputs_us = 3;
}

// From VIBRATION: the autopilot's accelerometer vibration levels (as logged in VIBE).
message VibrationState {
  uint32 age_ms = 1;
  repeated float levels_ms2 = 2;  // x, y, z
  repeated uint32 clipping = 3;   // per accelerometer, cumulative since boot
}

// From WIND (ArduPilot): the autopilot's wind estimate.
message WindState {
  uint32 age_ms = 1;
  float from_deg = 2;  // direction the wind comes from
  float speed_ms = 3;
  float speed_z_ms = 4;
}

message BatteryState {
  uint32 age_ms = 1;
  uint32 id = 2;
  uint32 function = 3;               // MAV_BATTERY_FUNCTION
  uint32 chemistry = 4;              // MAV_BATTERY_TYPE
  optional float temperature_c = 5;
  optional float voltage_v = 6;      // pack voltage
  repeated float cells_v = 7;        // empty unless the monitor measures cells
  optional float current_a = 8;
  optional int32 consumed_mah = 9;
  optional double consumed_j = 10;
  optional uint32 remaining_pct = 11;
  optional uint32 time_remaining_s = 12;
  uint32 charge_state = 13;          // MAV_BATTERY_CHARGE_STATE
  uint32 fault_bitmask = 14;         // MAV_BATTERY_FAULT
}

// One aircraft from ADSB_VEHICLE. Optional fields are absent unless the message's own
// ADSB_FLAGS mark them valid. Advisory only: plan 04 decides how it is shown.
message TrafficState {
  uint32 age_ms = 1;
  uint32 icao = 2;
  double lat_deg = 3;
  double lon_deg = 4;
  optional float alt_msl_m = 5;
  bool alt_geometric = 6;  // GNSS altitude; false = pressure (QNH)
  optional float heading_deg = 7;
  optional float speed_ms = 8;
  optional float climb_ms = 9;  // positive up
  optional string callsign = 10;
  optional uint32 squawk = 11;  // decimal digits, e.g. 7700
  uint32 emitter_type = 12;     // ADSB_EMITTER_TYPE
  uint32 tslc_s = 13;           // seconds since the receiver last heard it
  bool simulated = 14;          // ADSB_FLAGS_SIMULATED: not a real aircraft
  // From the vehicle, when its position is known: great-circle distance, initial bearing
  // (true), and height above it (reported traffic altitude vs vehicle MSL: approximate).
  optional double distance_m = 15;
  optional double bearing_deg = 16;
  optional float above_m = 17;
}

// From HOME_POSITION (autopilot component): where RTL returns to, and the reference for
// PositionState.alt_rel_m.
message HomeState {
  uint32 age_ms = 1;
  double lat_deg = 2;
  double lon_deg = 3;
  float alt_msl_m = 4;
}

message HeartbeatState {
  uint32 age_ms = 1;
  uint32 mav_type = 2;
  uint32 autopilot = 3;
  uint32 custom_mode = 4;   // ArduPilot flight mode number
  bool armed = 5;
  uint32 system_status = 6;
  // Flight mode name, only when the firmware is confirmed by its version banner (a guess
  // from MAV_TYPE never names a mode).
  optional string mode_name = 7;
}

message AttitudeState {
  uint32 age_ms = 1;
  float roll_rad = 2;
  float pitch_rad = 3;
  float yaw_rad = 4;
}

message PositionState {
  uint32 age_ms = 1;
  double lat_deg = 2;
  double lon_deg = 3;
  float alt_msl_m = 4;
  float alt_rel_m = 5;
  optional float heading_deg = 6;
}

message PowerState {
  uint32 age_ms = 1;
  optional float voltage_v = 2;
  optional float current_a = 3;
  optional uint32 remaining_pct = 4;
}

message GpsState {
  uint32 age_ms = 1;
  uint32 fix_type = 2;
  optional uint32 satellites = 3;
  optional float hdop = 4;
}

// From MISSION_CURRENT and MISSION_ITEM_REACHED (autopilot component). Item numbers are the
// vehicle's: on ArduPilot item 0 is home and the first mission item is 1.
message MissionProgress {
  uint32 age_ms = 1;
  uint32 current = 2;               // item being executed, or next to execute
  optional uint32 total = 3;        // items excluding home; absent if not reported, 0 if no mission
  MissionState state = 4;
  optional bool in_mission_mode = 5; // absent if not reported
  optional uint32 last_reached = 6;  // last MISSION_ITEM_REACHED
}

// MAVLink MISSION_STATE values.
enum MissionState {
  MISSION_STATE_UNKNOWN = 0;
  MISSION_STATE_NO_MISSION = 1;
  MISSION_STATE_NOT_STARTED = 2;
  MISSION_STATE_ACTIVE = 3;
  MISSION_STATE_PAUSED = 4;
  MISSION_STATE_COMPLETE = 5;
}

// How far the vehicle's position can be trusted (hazard H16).
message NavHealth {
  PositionTrust trust = 1;
  repeated string reasons = 2;  // why it is not GOOD; empty when GOOD
}

enum PositionTrust {
  POSITION_TRUST_UNKNOWN = 0;    // no current EKF report
  POSITION_TRUST_GOOD = 1;
  POSITION_TRUST_DEGRADED = 2;   // usable but degraded (high variance, no 3D fix)
  POSITION_TRUST_UNTRUSTED = 3;  // do not steer by it
}

// From EXTENDED_SYS_STATE (autopilot component).
message LandedState {
  uint32 age_ms = 1;
  uint32 landed_state = 2;  // MAV_LANDED_STATE: 0 undefined, 1 on ground, 2 in air, 3 takeoff, 4 landing
}

message GetLinkStatsRequest {}

message LinkEntry {
  uint32 id = 1;
  string name = 2;
}

// A (system, component) heard recently, and the link it was heard on.
message RouteEntry {
  uint32 sysid = 1;
  uint32 compid = 2;
  uint32 link_id = 3;
}

message LinkStats {
  repeated LinkEntry links = 1;
  repeated RouteEntry routes = 2;
  uint64 frames = 3;          // frames routed
  uint64 loops_dropped = 4;   // frames claiming our own identity
  uint64 flooded = 5;         // targeted frames for unknown systems, sent to every link
  uint64 app_dropped = 6;     // frames lost because the core's queue was full
  uint64 links_dropped = 7;   // link notifications lost (core not draining)
}

message ListLogsRequest {
  uint32 sysid = 1;   // 0 = first vehicle heard
  uint32 compid = 2;  // 0 = autopilot (1)
}

message LogInfo {
  uint32 id = 1;
  uint32 size = 2;      // bytes
  uint32 time_utc = 3;  // s since the Unix epoch, 0 if unknown
}

message LogList {
  uint32 sysid = 1;
  repeated LogInfo logs = 2;
}

message DownloadLogRequest {
  uint32 sysid = 1;
  uint32 compid = 2;
  uint32 id = 3;
}

message LogDownloadUpdate {
  uint32 received = 1;  // bytes so far
  uint32 size = 2;
  bytes data = 3;       // empty in progress updates; consecutive chunks at the end
  bool done = 4;        // last chunk
}

message GetGeotagsRequest {
  uint32 sysid = 1;  // 0 = first vehicle heard
}

message Geotag {
  uint64 time_usec = 1;  // image time from the autopilot (Unix epoch), 0 if unknown
  uint32 cam_idx = 2;
  uint32 img_idx = 3;
  double lat_deg = 4;
  double lon_deg = 5;
  float alt_msl_m = 6;
  float alt_rel_m = 7;
  float roll_deg = 8;
  float pitch_deg = 9;
  float yaw_deg = 10;
  uint32 flags = 11;     // CAMERA_FEEDBACK_FLAGS
}

message GeotagList {
  uint32 sysid = 1;
  repeated Geotag geotags = 2;
}

message GetMessagesRequest {
  uint32 sysid = 1;  // 0 = first vehicle heard
}

message LoggedMessage {
  uint64 unix_ms = 1;   // host time of receipt
  uint32 compid = 2;
  uint32 severity = 3;  // MAV_SEVERITY (0 emergency ... 7 debug)
  string text = 4;
}

message MessageList {
  uint32 sysid = 1;
  repeated LoggedMessage messages = 2;
}

// MAV_MISSION_TYPE values.
enum ItemKind {
  ITEM_KIND_MISSION = 0;  // on ArduPilot item 0 is home
  ITEM_KIND_FENCE = 1;
  ITEM_KIND_RALLY = 2;
}

message DownloadItemsRequest {
  uint32 sysid = 1;   // 0 = first vehicle heard
  uint32 compid = 2;  // 0 = autopilot (1)
  ItemKind kind = 3;
}

// One item as MISSION_ITEM_INT carries it.
message Item {
  uint32 frame = 1;           // MAV_FRAME
  uint32 command = 2;         // MAV_CMD
  repeated float params = 3;  // param1..param4
  int32 x = 4;                // latitude degE7 for commands with a location, else raw
  int32 y = 5;                // longitude degE7 for commands with a location, else raw
  float z = 6;
  bool autocontinue = 7;
}

message ItemList {
  uint32 sysid = 1;
  uint32 compid = 2;
  ItemKind kind = 3;
  repeated Item items = 4;
}

message GetParamsRequest {
  uint32 sysid = 1;          // 0 = first vehicle heard
  uint32 compid = 2;         // 0 = autopilot (1)
}

message Param {
  string name = 1;
  float value = 2;
  uint32 mav_param_type = 3;
  uint32 index = 4;
}

message ParamList {
  uint32 sysid = 1;
  uint32 compid = 2;
  repeated Param params = 3;
}

message ParamAssignment {
  string name = 1;
  double value = 2;
}

message SetParamsRequest {
  uint32 sysid = 1;          // 0 = first vehicle heard
  uint32 compid = 2;         // 0 = autopilot (1); only the autopilot is accepted
  repeated ParamAssignment changes = 3;
  bool acknowledge_armed_warning = 4;
}

enum ParamWriteStatus {
  PARAM_WRITE_STATUS_VERIFIED = 0;     // the explicit read-back matched
  PARAM_WRITE_STATUS_MISMATCH = 1;     // the vehicle reports another value (see value)
  PARAM_WRITE_STATUS_UNCONFIRMED = 2;  // no read-back in time: outcome unknown
}

message ParamWriteResult {
  string name = 1;
  ParamWriteStatus status = 2;
  float value = 3;           // the value read back (VERIFIED, MISMATCH)
}

message SetParamsReply {
  // Set when nothing was sent because the vehicle is armed: the text to show.
  string armed_warning = 1;
  // The baseline file on the daemon's host (for a rollback), when one was written.
  string snapshot = 2;
  uint32 planned = 3;
  repeated ParamWriteResult results = 4;
  string interruption = 5;   // why the batch stopped early, if it did
  bool verified = 6;         // every planned change verified
}

message StreamTelemetryRequest {
  uint32 sysid = 1;          // 0 = first vehicle heard
  float rate_hz = 2;         // 0 = 1 Hz; capped at 50 Hz
}

message StreamEventsRequest {}

message Event {
  oneof kind {
    StatusTextEvent status_text = 1;
    LinkEvent link = 2;
    uint32 vehicle_seen = 3; // system id
    VehicleLinkEvent vehicle_link = 4;
    RecorderEvent recorder = 5;
    CommandEvent command = 6;
    AlertEvent alert = 7;
    MissionEvent mission = 8;
    LinkStreamsEvent link_streams = 9;
  }
}

// A link's stream-rate request finished (link profiles, plan 09 Step 1).
message LinkStreamsEvent {
  uint32 sysid = 1;
  uint32 link_id = 2;
  // full, high or constrained-elrs.
  string profile = 3;
  // One line per message whose rate was not set and read back; empty = all set.
  repeated string problems = 4;
}

// Mission progress changed (MISSION_CURRENT / MISSION_ITEM_REACHED).
message MissionEvent {
  uint32 sysid = 1;
  oneof change {
    uint32 item_reached = 2;
    uint32 current = 3;
    MissionState state = 4;
  }
}

// Something the operator must be told (SR-05, ADR-0011), e.g. a mode change not confirmed
// within its 2-3 s lifetime (WARNING), or a verified mode change (ADVISORY).
message AlertEvent {
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    ADVISORY = 1;   // information
    CAUTION = 2;    // awareness, action may be needed later
    WARNING = 3;    // immediate action; shown with audio
  }
  uint32 sysid = 1;
  Level level = 2;
  string text = 3;
}

// A vehicle command changed state (plan 08 §4.2, ADR-0009). Commands are submitted through the
// core's CommandPolicy; this API only reports them.
message CommandEvent {
  uint64 id = 1;
  uint32 sysid = 2;
  string state = 3;     // Pending, InProgress, Acknowledged, Verified, Accepted, Rejected(n), Expired, Cancelled, Superseded
  bool final = 4;       // no more transmissions or changes
  uint32 attempts = 5;
  string summary = 6;   // operator-facing line, e.g. "RTL: SENT — NOT CONFIRMED (link LOST 7.2 s), attempt 3, 22 s left"
}

// Heartbeat link state of a vehicle changed (plan 08 §4.3).
message VehicleLinkEvent {
  enum State {
    STATE_UNSPECIFIED = 0;
    CONNECTED = 1;  // heartbeat younger than the stale threshold (default 1.5 s)
    STALE = 2;      // no heartbeat for stale..lost
    LOST = 3;       // no heartbeat for longer than the lost threshold (default 5 s)
  }
  uint32 sysid = 1;
  State state = 2;
  uint32 heartbeat_age_ms = 3;
}

// The .tlog recorder stopped (write failed) or is falling behind.
message RecorderEvent {
  bool stopped = 1;
  string detail = 2;
}

message StatusTextEvent {
  uint32 sysid = 1;
  uint32 severity = 2;       // MAV_SEVERITY
  string text = 3;
}

message LinkEvent {
  uint32 link_id = 1;
  bool up = 2;
  string detail = 3;
}
