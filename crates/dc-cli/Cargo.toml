[package]
name = "dc-cli"
description = "DrorControl command-line tool: connect, dump parameters and telemetry, run the core daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "dc-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
api = { path = "../api" }
dc-core = { path = "../dc-core" }
design-tokens = { path = "../design-tokens" }
link-serial = { path = "../link-serial" }
logs = { path = "../logs" }
mavlink-codec.workspace = true
protocols = { path = "../protocols" }
recorder = { path = "../recorder" }
serde_json = "1.0.152"
serialport = { version = "4.10", default-features = false }
tokio.workspace = true
tonic = "0.14"

[lints]
workspace = true
