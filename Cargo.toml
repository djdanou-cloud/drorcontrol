[workspace]
resolver = "3"
# Add "crates/*" here when the first crate lands (T0-02); after that, new crates need no
# edit to this file. (Cargo rejects a glob that matches nothing.)
members = ["xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false
repository = "https://github.com/djdanou-cloud/drorcontrol"
# `license` intentionally unset: licence posture is an open owner decision (docs/plan/README.md §5).

[workspace.lints.rust]
unsafe_code = "deny"     # crates that need FFI (core-ffi, platform-*) opt out with a crate-level allow + ADR note
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
